name: botname
on: workflow_dispatch
jobs:
  name:
    runs-on: ubuntu-latest
    steps:
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getMe" | python3 -c "import sys,json;print('BOT_USERNAME=' + json.load(sys.stdin)['result']['username'])"
