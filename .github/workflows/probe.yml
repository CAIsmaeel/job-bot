name: probe
# Dry run to find out why companies give 0 jobs. Posts nothing to Telegram, changes no data.
on:
  workflow_dispatch:
    inputs:
      names:
        description: "Company names separated by | (empty = all companies with 0 jobs last run)"
        required: false
        default: ""
      limit:
        description: "Only the first N companies (0 = all)"
        required: false
        default: "0"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Load last results (data branch)
        run: git fetch -q --depth=1 origin data && git checkout origin/data -- engine/out || true
      - name: Probe
        env:
          PROBE_NAMES: ${{ inputs.names }}
          PROBE_LIMIT: ${{ inputs.limit }}
        run: python engine/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: engine/out/probe.json
