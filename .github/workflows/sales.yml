name: sales
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      selftest: {type: boolean, default: false}
concurrency: {group: sales, cancel-in-progress: false}
jobs:
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests cryptography
      - name: Email licence keys for new payments
        env:
          RZP_KEY_ID: ${{ secrets.RZP_KEY_ID }}
          RZP_KEY_SECRET: ${{ secrets.RZP_KEY_SECRET }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LICENCE_PRIVATE_JWK: ${{ secrets.LICENCE_PRIVATE_JWK }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          for v in RZP_KEY_ID RZP_KEY_SECRET GMAIL_APP_PASSWORD LICENCE_PRIVATE_JWK; do
            if [ -z "${!v}" ]; then echo "secret $v is not set yet, skipping"; exit 0; fi
          done
          if [ "${{ inputs.selftest }}" = "true" ]; then python engine/sales.py --selftest; fi
          python engine/sales.py
