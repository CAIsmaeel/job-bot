name: engine
# Finance job engine: reads finance jobs in India from company career sites,
# builds the jobs page (engine/out/site/index.html) and posts new jobs to the Telegram channel.
# Separate from the personal job bot (bot.py / run.yml), which it does not touch.
on:
  schedule:
    - cron: "23 1-17/2 * * *"   # every 2 hours, about 6:53 AM to 10:53 PM India time
  workflow_dispatch:
    inputs:
      test_post:
        description: "Post 3 sample jobs to the channel in the current format"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: engine
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Load last results (data branch)
        run: |
          git fetch -q --depth=1 origin data 2>/dev/null && git checkout origin/data -- engine/out 2>/dev/null || echo "no data branch yet, using main copy"
      - name: Run engine
        env:
          TG_CHANNEL_TOKEN: ${{ secrets.TG_CHANNEL_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          SITE_URL: ${{ vars.SITE_URL || 'https://finrehearse.pages.dev' }}
          SIMULATOR_URL: ${{ vars.SIMULATOR_URL || 'https://finrehearse.pages.dev/app/' }}
          TG_TEST: ${{ inputs.test_post }}
        run: python engine/engine.py
      - name: Put website online
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash engine/deploy.sh
      - name: Save results (data branch, one commit, no history)
        if: always()
        run: |
          rm -rf /tmp/data && mkdir -p /tmp/data/engine && cp -r engine/out /tmp/data/engine/out
          cd /tmp/data && git init -q -b data && git add -A && git -c user.name=engine -c user.email=engine@users.noreply.github.com commit -q -m "engine results $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data
