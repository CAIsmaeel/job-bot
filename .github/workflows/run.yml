name: job-bot
# Self-running loop: each run checks jobs every hour for ~5 hours, then starts the next run itself.
# (GitHub's own cron schedule was not firing reliably, so it is only a backup kick here.)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 */6 * * *"   # backup: restarts the loop if it ever stops
permissions:
  contents: write
  actions: write
concurrency:
  group: job-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot every hour (7 AM - 11 PM India time)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TOKEN_PRAGDESH: ${{ secrets.TELEGRAM_TOKEN_PRAGDESH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTACT_LINE: ${{ secrets.CONTACT_LINE }}
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          save() {
            git add state.json users/*/state.json 2>/dev/null || true
            git diff --cached --quiet && return 0
            git commit -q -m "bot state"
            for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && return 0; sleep 5; done
          }
          for round in 1 2 3 4 5; do
            t0=$(date +%s)
            hour=$(TZ=Asia/Kolkata date +%H)
            if [ "$hour" -ge 7 ] && [ "$hour" -lt 23 ]; then
              timeout 12m python bot.py || echo "bot run failed, continuing"
              save
              # Pragdesh: his own separate bot (secret TELEGRAM_TOKEN_PRAGDESH), his own chat and jobs
              if [ -n "$TELEGRAM_TOKEN_PRAGDESH" ]; then
                BOT_HOME=users/pragdesh TELEGRAM_TOKEN="$TELEGRAM_TOKEN_PRAGDESH" GEMINI_API_KEY="" timeout 9m python bot.py || echo "pragdesh run failed"
                save
              fi
            else
              echo "Night time ($hour h IST) - skipping"
            fi
            if [ "$round" -lt 5 ]; then left=$((3300 - ($(date +%s) - t0))); [ "$left" -gt 60 ] || left=60; sleep "$left"; fi
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches \
            -d '{"ref":"main"}' && echo "next run started"
