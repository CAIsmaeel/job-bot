name: job-bot
on:
  schedule:
    - cron: "30 1-17 * * *"   # every hour, 7 AM to 11 PM India time (public repo = free minutes)
  workflow_dispatch: {}        # "Run workflow" button for testing
permissions:
  contents: write
concurrency: job-bot
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTACT_LINE: ${{ secrets.CONTACT_LINE }}
      - name: Save memory (seen jobs, learned skills)
        if: always()
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet && exit 0
          git commit -m "bot state"
          for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q && exit 0; sleep 5; done
          exit 1
